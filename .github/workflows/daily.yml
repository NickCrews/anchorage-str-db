name: Daily Anchorage STR scrape

on:
  schedule:
    # 12:00 UTC = 04:00 AKDT / 03:00 AKST, before the anchorage-property
    # refresh at 14:00 UTC.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      start_fresh:
        description: Start a new, empty archive if latest-data has no database.
        type: boolean
        default: false

# Never let two runs write to the database at once.
concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A run takes about an hour (see "Request budget" in CONTRIBUTING.md).
    timeout-minutes: 120
    permissions:
      contents: write # to upload the updated database as a release asset
      issues: write # to open an issue when a run fails
    env:
      GH_TOKEN: ${{ github.token }}
      DB_PATH: data/anchorage_str.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Node runs the TypeScript sources directly and ignores types, so check
      # them here; a type error then fails before the scrape instead of
      # mid-run. `...` includes the workspace packages the scraper imports.
      - run: pnpm --filter "@anchorage-str-db/scraper..." typecheck

      # The runner starts clean, so restore yesterday's database from the
      # release. A missing database fails the run unless `start_fresh` is set.
      - name: Restore previous database
        uses: ./.github/actions/restore-db
        with:
          db-path: ${{ env.DB_PATH }}
          start-fresh: ${{ inputs.start_fresh }}

      - name: Scrape + merge + quality gate
        run: node packages/scraper/src/cli.ts --db "$DB_PATH" --verbose daily

      # Reached only if the quality checks passed.
      - name: Publish updated database
        uses: ./.github/actions/publish-db
        with:
          db-path: ${{ env.DB_PATH }}

      # When the newest backup is 7+ days old, plus every manual run. Keyed on
      # the newest backup rather than the weekday, so a run that fails on the
      # backup day doesn't skip the whole week: the next success catches up.
      - name: Weekly dated backup
        run: |
          today=$(date -u +%Y-%m-%d)
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
                     --jq '[.[].tagName | select(test("^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | last // ""')
          if [ -n "$newest" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            age=$(( ($(date -u -d "$today" +%s) - $(date -u -d "${newest#backup-}" +%s)) / 86400 ))
            if [ "$age" -lt 7 ]; then
              echo "no backup today: newest is $newest, $age days old"
              exit 0
            fi
          fi
          tag="backup-$today"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" "$DB_PATH" --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Backup $today" \
              --notes "Dated snapshot, kept indefinitely (unlike latest-data, which is overwritten daily)."
          fi

      - name: Close the outage issue
        continue-on-error: true
        uses: ./.github/actions/outage-issue
        with:
          action: close
          label: pipeline-down
          description: Daily scrape is failing
          docs: '"How CI runs this" in CONTRIBUTING.md'

      - name: Open an issue on failure
        if: failure() || cancelled()
        uses: ./.github/actions/outage-issue
        with:
          action: open
          label: pipeline-down
          description: Daily scrape is failing
          docs: '"How CI runs this" in CONTRIBUTING.md'
