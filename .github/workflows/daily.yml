name: Daily Anchorage STR scrape

on:
  schedule:
    # 12:00 UTC = 04:00 Anchorage (AKDT) / 03:00 (AKST) — quiet hours, and
    # well clear of the anchorage-property refresh at 14:00 UTC in case
    # anyone ever wants to correlate run times.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      start_fresh:
        description: Start a new, empty archive if latest-data has no database.
        type: boolean
        default: false

# Never let two runs write to the database at once.
concurrency:
  group: str-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A run takes about 50 minutes (see "Request budget" in CONTRIBUTING.md).
    timeout-minutes: 120
    permissions:
      contents: write # to upload the updated database as a release asset
      issues: write # to open an issue when a run fails
    env:
      GH_TOKEN: ${{ github.token }}
      DB_PATH: data/anchorage_str.duckdb
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - run: uv sync --frozen

      # The runner starts clean, so restore yesterday's database from the
      # release. A missing database fails the run unless `start_fresh` is set.
      - name: Restore previous database
        env:
          START_FRESH: ${{ inputs.start_fresh }}
        run: |
          mkdir -p data
          asset=$(basename "$DB_PATH")
          # "release not found" means empty; any other error is an outage.
          if ! names=$(gh release view latest-data --repo "$GITHUB_REPOSITORY" \
                         --json assets --jq '.assets[].name' 2>&1); then
            if [[ "$names" == *"release not found"* ]]; then
              names=""
            else
              echo "::error::could not list the latest-data release: $names"
              exit 1
            fi
          fi
          if grep -qxF "$asset" <<< "$names"; then
            gh release download latest-data --repo "$GITHUB_REPOSITORY" \
              --pattern "$asset" --output "$DB_PATH"
            echo "restored previous database"
          elif [ "$START_FRESH" = "true" ]; then
            echo "no $asset on latest-data; starting a new archive (start_fresh)"
          else
            echo "::error::latest-data has no $asset. To start a new archive, run with start_fresh=true."
            exit 1
          fi

      - name: Scrape + merge + quality gate
        run: uv run anchorage-str-db --db "$DB_PATH" --verbose daily

      # Only reached if the quality gate passed (daily exits non-zero on
      # any error-severity check, which fails the step above first).
      - name: Publish updated database
        run: |
          tag=latest-data
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "$DB_PATH" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" "$DB_PATH" --repo "$GITHUB_REPOSITORY" \
              --title "Latest data" \
              --notes "Always the most recent successful daily scrape. Superseded on every run — see scrape_runs in the database for history, and git history of this workflow for the pipeline that produced it."
          fi

      # Sundays (UTC), plus every manual run.
      - name: Weekly dated backup
        run: |
          if [ "$(date -u +%u)" != 7 ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "no backup today"
            exit 0
          fi
          tag="backup-$(date -u +%Y-%m-%d)"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$tag" "$DB_PATH" --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Backup $(date -u +%Y-%m-%d)" \
              --notes "Dated snapshot, kept indefinitely (unlike latest-data, which is overwritten daily)."
          fi

      - name: Close the outage issue
        continue-on-error: true
        run: |
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-down \
                       --state open --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $RUN_URL"
          done

      # A red X in the Actions tab notifies no one.
      - name: Open an issue on failure
        if: failure() || cancelled()
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          gh label create pipeline-down --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The daily scrape is failing" 2>/dev/null || true
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label pipeline-down \
                   --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" \
              --body "Failed again on $(date -u +%Y-%m-%d): $RUN_URL"
            exit 0
          fi
          gh issue create --repo "$GITHUB_REPOSITORY" --label pipeline-down \
            --title "Daily scrape is failing" --body-file - <<EOF
          @$OWNER the daily scrape failed on $(date -u +%Y-%m-%d): $RUN_URL

          The next successful run closes this issue. See "How CI runs this" in CONTRIBUTING.md.
          EOF
