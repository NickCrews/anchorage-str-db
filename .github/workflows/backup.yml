name: Weekly database backup

on:
  schedule:
    # 06:00 UTC, when no source workflow is writing latest-data.
    - cron: "0 6 * * *"
  # Every manual run makes a backup.
  workflow_dispatch:

# Not in the db-write group: it only reads latest-data, and GitHub keeps one
# pending run per group, so joining would let a backup cancel a queued source
# run. A download during a source's publish can find no asset (`--clobber`
# deletes it before uploading); the backup then fails and runs again the next
# day.
concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # to create the backup release
      issues: write # to open an issue when a backup fails
    env:
      GH_TOKEN: ${{ github.token }}
      DB_PATH: data/anchorage_str.duckdb
    steps:
      # For the outage-issue action.
      - uses: actions/checkout@v4

      # Runs daily but backs up only when the newest backup is 7+ days old,
      # so a failed backup is retried the next day rather than next week.
      - name: Back up latest-data when the newest backup is 7+ days old
        run: |
          today=$(date -u +%Y-%m-%d)
          newest=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName \
                     --jq '[.[].tagName | select(test("^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}$"))] | sort | last // ""')
          if [ -n "$newest" ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            age=$(( ($(date -u -d "$today" +%s) - $(date -u -d "${newest#backup-}" +%s)) / 86400 ))
            if [ "$age" -lt 7 ]; then
              echo "no backup today: newest is $newest, $age days old"
              exit 0
            fi
          fi
          tag="backup-$today"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi
          mkdir -p "$(dirname "$DB_PATH")"
          gh release download latest-data --repo "$GITHUB_REPOSITORY" \
            --pattern "$(basename "$DB_PATH")" --output "$DB_PATH"
          gh release create "$tag" "$DB_PATH" --repo "$GITHUB_REPOSITORY" \
            --latest=false \
            --title "Backup $today" \
            --notes "Dated snapshot of latest-data, kept indefinitely (latest-data is overwritten by every source's run)."

      - name: Close the outage issue
        continue-on-error: true
        uses: ./.github/actions/outage-issue
        with:
          action: close
          title: Weekly database backup is failing
          docs: '"CI" in CONTRIBUTING.md'

      - name: Open an issue on failure
        if: failure() || cancelled()
        uses: ./.github/actions/outage-issue
        with:
          action: open
          title: Weekly database backup is failing
          docs: '"CI" in CONTRIBUTING.md'
