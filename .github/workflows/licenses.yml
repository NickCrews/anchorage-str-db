name: Muni license scrape

on:
  schedule:
    # 08:00 UTC = 00:00 AKDT / 23:00 AKST, well before the Airbnb scrape at 12:00.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      start_fresh:
        description: Start a new, empty archive if latest-data has no database.
        type: boolean
        default: false

# Never let two runs write to the database at once.
concurrency:
  group: db-write
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A scrape reads at most 3000 pages at about 2 a second: about 25 minutes,
    # longer when the portal slows and the pacer backs off.
    timeout-minutes: 90
    permissions:
      contents: write # to upload the updated database as a release asset
      issues: write # to open an issue when a scrape fails
    env:
      DB_PATH: data/anchorage_str.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Node runs the TypeScript sources directly and ignores types, so check
      # them here. `...` includes the workspace packages the CLI imports.
      - run: pnpm --filter "@anchorage-str-db/cli..." typecheck

      # The runner starts clean, so restore the database from the release. A
      # missing database fails the scrape unless `start_fresh` is set.
      - name: Restore previous database
        uses: ./.github/actions/restore-db
        with:
          db-path: ${{ env.DB_PATH }}
          start-fresh: ${{ inputs.start_fresh }}

      - name: Scrape license pages + quality gate
        run: node packages/cli/src/cli.ts scrape licenses --db "$DB_PATH" --verbose

      # Reached only if the quality checks passed.
      - name: Publish updated database
        uses: ./.github/actions/publish-db
        with:
          db-path: ${{ env.DB_PATH }}

      - name: Close the outage issue
        continue-on-error: true
        uses: ./.github/actions/outage-issue
        with:
          action: close
          title: License scrape is failing
          docs: '"CI" in CONTRIBUTING.md'

      - name: Open an issue on failure
        if: failure() || cancelled()
        uses: ./.github/actions/outage-issue
        with:
          action: open
          title: License scrape is failing
          docs: '"CI" in CONTRIBUTING.md'
